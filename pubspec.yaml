#personalised_learning_app/pubspec.yaml
name: personalised_learning_app
description: "A new Flutter project."
publish_to: 'none' # Prevents accidental publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <3.8.0" # Matches your current Dart SDK

dependencies:
  flutter:
    sdk: flutter

  # Core packages
  http: ^1.2.2
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_spinkit: ^5.2.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # ✅ Compatible with Dart 3.7.x

# Override transitive dependencies to resolve outdated constraints
dependency_overrides:
  async: ^2.13.0
  characters: ^1.4.1
  material_color_utilities: ^0.13.0
  meta: ^1.17.0
  vector_math: ^2.2.0
  fake_async: ^1.3.3
  leak_tracker: ^11.0.1
  leak_tracker_flutter_testing: ^3.0.10
  leak_tracker_testing: ^3.0.2
  lints: ^5.0.0
  test_api: ^0.7.7
  vm_service: ^15.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/