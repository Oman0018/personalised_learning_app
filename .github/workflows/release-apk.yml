# .github/workflows/release-apk.yml
name: Build Release APK
run-name: Build APK for ${{ github.ref_name || 'manual' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# Run all commands inside the Flutter app directory
defaults:
  run:
    working-directory: personalised_learning_app

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ARTIFACT_SUFFIX: ${{ github.ref_name || 'manual' }}
      FLUTTER_VERSION: "3.29.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---- Set up Android SDK toolchain (cmdline-tools, sdkmanager) ----
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---- Ensure required SDK packages with retries (API 34) ----
      - name: Install Android SDK packages (API 34) with retries
        shell: bash
        run: |
          set -e
          echo "sdkmanager version:"
          sdkmanager --version || true

          # Update repo metadata first (non-fatal if nothing to update)
          yes | sdkmanager --update || true

          # Retry install a few times to survive flaky mirrors
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: installing SDK packages..."
            set +e
            yes | sdkmanager \
              "platform-tools" \
              "platforms;android-34" \
              "build-tools;34.0.0"
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              echo "✅ SDK packages installed."
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "sdkmanager failed (exit $code). Retrying in 20s..."
              sleep 20
            else
              echo "❌ Failed to install SDK packages after 3 attempts."
              exit $code
            fi
          done

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      # ---- Install Flutter (manual, reliable) ----
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        shell: bash
        run: |
          set -e
          echo "Downloading Flutter $FLUTTER_VERSION..."
          curl -L -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          sudo tar -xJf flutter.tar.xz -C /opt
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter doctor -v

      - name: Verify pubspec.yaml
        run: |
          pwd
          ls -la
          test -f pubspec.yaml && echo "✅ pubspec.yaml found" || (echo "❌ pubspec.yaml missing" && exit 1)

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ env.ARTIFACT_SUFFIX }}.apk
          # path relative to repo root, so include subdir
          path: personalised_learning_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK (unsigned)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.ARTIFACT_SUFFIX }}.apk
          path: personalised_learning_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
