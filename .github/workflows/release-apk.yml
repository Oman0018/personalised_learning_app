# .github/workflows/release-apk.yml
name: Build Release APK
run-name: Build APK for ${{ github.ref_name || 'manual' }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_DIR: .
      FLUTTER_VERSION: "3.29.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages (API 35) with retries
        shell: bash
        run: |
          set -e
          yes | sdkmanager --update || true
          for i in 1 2 3; do
            set +e
            yes | sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
            code=$?
            set -e
            if [ $code -eq 0 ]; then
              echo "✅ SDK packages installed."
              break
            fi
            if [ $i -lt 3 ]; then
              echo "sdkmanager failed (exit $code). Retrying in 15s..."
              sleep 15
            else
              echo "❌ Failed to install SDK packages after 3 attempts."
              exit $code
            fi
          done

      - name: Accept Android licenses
        shell: bash
        run: yes | sdkmanager --licenses || true

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        shell: bash
        run: |
          set -e
          curl -L -o flutter.tar.xz \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          sudo tar -xJf flutter.tar.xz -C /opt
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          echo "/opt/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
          flutter --version
          flutter doctor -v

      - name: Verify repo root (pubspec.yaml present)
        shell: bash
        run: |
          pwd
          ls -la
          test -f pubspec.yaml && echo "✅ pubspec.yaml found" || (echo "❌ pubspec.yaml missing" && exit 1)

      - name: Compute artifact suffix
        id: suffix
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "suffix=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            s="${GITHUB_REF_NAME//\//-}"
            echo "suffix=${s:-manual}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: Analyze
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter analyze

      - name: Run tests
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter test --no-pub

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ steps.suffix.outputs.suffix }}.apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK (unsigned)
        shell: bash
        working-directory: ${{ env.APP_DIR }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.suffix.outputs.suffix }}.apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
