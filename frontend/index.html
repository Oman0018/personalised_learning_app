<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personalised Learning Recommendation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background-color: #f6f9fc;">

  <div class="container mt-5">
    <h2 class="mb-4 text-primary fw-bold">Get Your Recommended Learning Topic</h2>

    <form id="recommendForm" class="p-4 rounded shadow-sm bg-white">
      <div class="mb-3">
        <label class="form-label">Average Quiz Score:</label>
        <input type="number" id="quiz_score" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Average Time Spent (minutes):</label>
        <input type="number" id="time_spent" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Content Type Preference:</label>
        <select id="content_pref" class="form-select">
          <option value="1">Video</option>
          <option value="2">Text</option>
          <option value="3">Interactive</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Topic Engagement (1–5):</label>
        <input type="number" id="engagement" class="form-control" min="1" max="5" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Submit</button>
    </form>

    <!-- Loading spinner -->
    <div id="spinner" class="text-center mt-3" style="display:none;">
      <div class="spinner-border text-info" role="status"></div>
      <p>Getting recommendation...</p>
    </div>

    <!-- Result display -->
    <div id="result" class="mt-4"></div>
  </div>

  <script>
    document.getElementById("recommendForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      document.getElementById("spinner").style.display = "block";
      document.getElementById("result").innerHTML = "";

      const score = parseInt(document.getElementById("quiz_score").value);
      const time = parseInt(document.getElementById("time_spent").value);
      const type = parseInt(document.getElementById("content_pref").value);
      const engagement = parseInt(document.getElementById("engagement").value);

      const payload = {
        avg_quiz_score: score,
        avg_time_spent: time,
        content_type_pref: type,
        topic_engagement: engagement
      };

      try {
        const response = await fetch("http://127.0.0.1:5000/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        document.getElementById("spinner").style.display = "none";

        if (result.status === "success") {
          document.getElementById("result").innerHTML = `
            <div class="alert alert-success">
              <strong>✅ Recommended Topic:</strong> ${result.recommended_topic}<br>
              <strong>🎯 Cluster:</strong> ${result.user_cluster}
              <br><button class="btn btn-sm btn-outline-dark mt-2" onclick="downloadResult('${result.recommended_topic}', '${result.user_cluster}')">📥 Download as .txt</button>
            </div>`;
        } else {
          throw new Error(result.error || "Unknown error");
        }

      } catch (error) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("result").innerHTML = `<div class="alert alert-danger">❌ Error getting recommendation. (${error})</div>`;
      }
    });

    function downloadResult(topic, cluster) {
      const content = `Recommended Topic: ${topic}\nCluster: ${cluster}`;
      const blob = new Blob([content], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "recommendation.txt";
      link.click();
    }
  </script>

</body>
</html>
