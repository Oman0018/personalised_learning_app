# android/gradle.properties

# Sensible JVM/Gradle defaults (your previous huge metaspace/code-cache flags aren’t needed)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX/Jetifier (keep Jetifier=true unless you’re 100% sure no legacy support libs are used)
android.useAndroidX=true
android.enableJetifier=true

# Optional: consistent Kotlin formatting
kotlin.code.style=official
